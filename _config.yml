# Jekyll configuration for GitHub Pages
# https://docs.github.com/en/pages/setting-up-a-github-pages-site-with-jekyll/about-github-pages-and-jekyll

title: "Skool API Docs"
description: "The complete unofficial Skool API documentation — read AND write to Skool communities via the Apify-hosted Skool All-in-One API actor. Integrations, recipes, glossary, comparisons."
url: "https://ctala.github.io"
baseurl: "/skool-api-docs"

author:
  name: "Cristian Tala"
  url: "https://cristiantala.com"
  twitter: ctala

# Default theme (GitHub Pages built-in)
theme: jekyll-theme-cayman

# Plugins (GitHub Pages whitelist — no Gemfile needed)
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

# Exclude internal files from the built site
exclude:
  - templates/
  - .github/
  - LICENSE
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - "*.py"
  - "*.sh"

# Markdown processor
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Permalinks — keep the file paths simple and SEO-friendly
permalink: pretty

# Social / SEO defaults applied to every page (overridden by per-page frontmatter)
twitter:
  username: ctala
  card: summary_large_image

social:
  name: "Cristian Tala"
  links:
    - "https://github.com/ctala"
    - "https://cristiantala.com"

# Per-section defaults — avoids editing 60 .md files individually
defaults:
  - scope:
      path: "learn"
    values:
      layout: default
      funnel: A
      section: Learn
  - scope:
      path: "integrations"
    values:
      layout: default
      funnel: A
      section: Integrations
  - scope:
      path: "automation"
    values:
      layout: default
      funnel: A
      section: Automation
  - scope:
      path: "recipes"
    values:
      layout: default
      funnel: A
      section: Recipes
  - scope:
      path: "for"
    values:
      layout: default
      funnel: A
      section: For
  - scope:
      path: "compare"
    values:
      layout: default
      funnel: B
      section: Compare
  - scope:
      path: "guide"
    values:
      layout: default
      funnel: B
      section: Guide
  - scope:
      path: "docs"
    values:
      layout: default
      section: Docs
  - scope:
      path: ""
    values:
      layout: default
